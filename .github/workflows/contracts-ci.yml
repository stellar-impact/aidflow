name: Contracts CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

  clippy:
    name: Lint (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run Clippy
        working-directory: contracts
        run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run tests
        working-directory: contracts
        run: cargo test --all

  build:
    name: Build (stellar-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - uses: cargo-bins/cargo-binstall@main

      - name: Install stellar-cli
        run: cargo binstall -y stellar-cli --version '^27'

      - name: Build contracts
        working-directory: contracts
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      
      - name: Verify WASM outputs
        run: |
          ls -lh contracts/target/wasm32v1-none/release/*.wasm || echo "No WASM files yet (expected for early modules)"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit
        run: cargo binstall -y cargo-audit
      
      - name: Run security audit
        working-directory: contracts
        run: cargo audit || echo "Audit warnings (non-blocking for now)"
